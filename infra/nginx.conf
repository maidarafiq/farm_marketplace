# /etc/nginx/sites-available/farm-marketplace
# Serves the React build as static files and reverse-proxies /api to the
# Express backend running under pm2 on port 5000.

server {
    listen 80;
    server_name _;

    root /var/www/farm-marketplace;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # React Router - fall back to index.html for client-side routes
    location / {
        try_files $uri /index.html;
    }
}
